    <circle cx="195" cy="172" r="0.9" opacity="0.5"/>
    <circle cx="320" cy="76" r="1.4" opacity="0.8"/>
    <circle cx="440" cy="226" r="0.9" opacity="0.5"/>
    <circle cx="530" cy="72" r="1.1" opacity="0.65"/>
    <circle cx="615" cy="252" r="1.3" opacity="0.7"/>
    <circle cx="700" cy="92" r="0.8" opacity="0.5"/>
    <circle cx="775" cy="234" r="1.0" opacity="0.6"/>
    <circle cx="55" cy="244" r="1.0" opacity="0.55"/>
    <circle cx="980" cy="62" r="1.2" opacity="0.7"/>
    <circle cx="1065" cy="256" r="0.9" opacity="0.5"/>
    <circle cx="275" cy="274" r="1.1" opacity="0.6"/>
    <circle cx="480" cy="162" r="0.7" opacity="0.4"/>
    <circle cx="840" cy="132" r="1.2" opacity="0.65"/>
    <circle cx="150" cy="194" r="0.7" opacity="0.4"/>
    <circle cx="730" cy="274" r="0.8" opacity="0.5"/>
    <circle cx="400" cy="46" r="1.0" opacity="0.55"/>
