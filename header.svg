<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sloane - Agent Brain / Wrapper">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050a0a"/>
      <stop offset="50%" stop-color="#0a1616"/>
      <stop offset="100%" stop-color="#122323"/>
    </linearGradient>
    <radialGradient id="tealglow" cx="0.85" cy="0.5" r="0.42">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambergow" cx="0.12" cy="0.55" r="0.35">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.85">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="accentfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#tealglow)"/>
  <rect width="1200" height="320" fill="url(#ambergow)"/>

  <!-- Titan particulates / Arc sparks -->
  <g fill="#5eead4">
    <circle cx="130" cy="65" r="1.2" opacity="0.75"/>
    <circle cx="270" cy="185" r="0.9" opacity="0.5"/>
    <circle cx="390" cy="95" r="1.3" opacity="0.8"/>
    <circle cx="510" cy="235" r="0.9" opacity="0.5"/>
    <circle cx="610" cy="85" r="1.1" opacity="0.65"/>
    <circle cx="710" cy="265" r="1.2" opacity="0.7"/>
    <circle cx="790" cy="105" r="0.8" opacity="0.5"/>
    <circle cx="870" cy="245" r="1" opacity="0.6"/>
    <circle cx="100" cy="255" r="1" opacity="0.55"/>
    <circle cx="1080" cy="75" r="1.1" opacity="0.7"/>
    <circle cx="1160" cy="265" r="0.9" opacity="0.5"/>
    <circle cx="340" cy="285" r="1.1" opacity="0.6"/>
    <circle cx="560" cy="175" r="0.7" opacity="0.4"/>
    <circle cx="930" cy="145" r="1.2" opacity="0.65"/>
    <circle cx="210" cy="205" r="0.7" opacity="0.4"/>
    <circle cx="810" cy="285" r="0.8" opacity="0.5"/>
  </g>

  <g stroke="#0d9488" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Titan mark / Arc conductor icon (right) -->
  <g transform="translate(980,160) scale(3.8) translate(-16, -16)" opacity="0.85" fill="#0d9488">
    <path d="M16 4c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8zm0 24c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M4 16c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8-8-3.582-8-8zm0-12c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M28 16c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8-8-3.582-8-8zm0-12c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M4 4c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8zm0 24c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M16 28c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8-8-3.582-8-8zm0-12c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
  </g>

  <!-- Reticle -->
  <g fill="none" stroke="#0d9488">
    <circle cx="980" cy="160" r="112" stroke-width="0.7" opacity="0.18"/>
  </g>

  <!-- Title block (left) -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" filter="url(#textblur)" opacity="0.7">
    <text x="60" y="90" font-size="18" font-weight="500" fill="#000000" letter-spacing="8">[ TITAN  ·  ARC  ·  TITAN VANGUARD  ·  SATURN ]</text>
    <text x="60" y="150" font-size="66" font-weight="700" fill="#000000" letter-spacing="2">SLOANE</text>
    <text x="60" y="200" font-size="20" font-weight="500" fill="#000000" letter-spacing="5">AGENT BRAIN  /  WRAPPER</text>
    <text x="62" y="230" font-size="15" font-weight="400" fill="#000000" letter-spacing="4">THE DEEP DOESN'T FORGET. NEITHER DO I.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif">
    <text x="60" y="90" font-size="18" font-weight="500" fill="#5eead4" letter-spacing="8">[ TITAN  ·  ARC  ·  TITAN VANGUARD  ·  SATURN ]</text>
    <text x="60" y="150" font-size="66" font-weight="700" fill="#f0fdfa" letter-spacing="2">SLOANE</text>
    <text x="60" y="200" font-size="20" font-weight="500" fill="#99f6e4" letter-spacing="5">AGENT BRAIN  /  WRAPPER</text>
    <text x="62" y="230" font-size="15" font-weight="400" fill="#8a8a8a" letter-spacing="4">THE DEEP DOESN'T FORGET. <tspan x="215" fill="#5eead4">NEITHER DO I.</tspan></text>
  </g>

  <rect x="60" y="172" width="400" height="1.5" fill="url(#accentfade)"/>

  <text transform="translate(1184, 243) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" font-size="8" font-weight="500" letter-spacing="2" fill="#0d9488" opacity="0.25">SATURN  ·  TITAN'S REST  ·  THE DEEP</text>

  <g fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.5">
    <path d="M 24 46 L 24 24 L 46 24"/>
    <path d="M 1176 274 L 1176 296 L 1154 296"/>
  </g>

  <rect width="360" height="320" fill="url(#leftfade)"/>
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>