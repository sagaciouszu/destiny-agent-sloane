<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sloane - Agent Brain / Wrapper">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020606"/>
      <stop offset="40%" stop-color="#040d0d"/>
      <stop offset="100%" stop-color="#071616"/>
    </linearGradient>
    <radialGradient id="tealglow" cx="0.75" cy="0.45" r="0.58">
      <stop offset="0%" stop-color="#1fb8a8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambergow" cx="0.25" cy="0.55" r="0.42">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="0.5" cy="0.35" r="0.25">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="accentbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="25%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#tealglow)"/>
  <rect width="1200" height="320" fill="url(#ambergow)"/>
  <rect width="1200" height="320" fill="url(#coreglow)"/>

  <!-- Arc/Titan particulates -->
  <g fill="#5eead4">
    <circle cx="72" cy="52" r="1.3" opacity="0.75"/>
    <circle cx="195" cy="172" r="0.9" opacity="0.5"/>
    <circle cx="320" cy="76" r="1.4" opacity="0.8"/>
    <circle cx="440" cy="226" r="0.9" opacity="0.5"/>
    <circle cx="530" cy="72" r="1.1" opacity="0.65"/>
    <circle cx="615" cy="252" r="1.3" opacity="0.7"/>
    <circle cx="700" cy="92" r="0.8" opacity="0.5"/>
    <circle cx="775" cy="234" r="1.0" opacity="0.6"/>
    <circle cx="55" cy="244" r="1.0" opacity="0.55"/>
    <circle cx="980" cy="62" r="1.2" opacity="0.7"/>
    <circle cx="1065" cy="256" r="0.9" opacity="0.5"/>
    <circle cx="275" cy="274" r="1.1" opacity="0.6"/>
    <circle cx="480" cy="162" r="0.7" opacity="0.4"/>
    <circle cx="840" cy="132" r="1.2" opacity="0.65"/>
    <circle cx="150" cy="194" r="0.7" opacity="0.4"/>
    <circle cx="730" cy="274" r="0.8" opacity="0.5"/>
    <circle cx="400" cy="46" r="1.0" opacity="0.55"/>
    <circle cx="910" cy="194" r="0.8" opacity="0.45"/>
    <circle cx="118" cy="126" r="0.9" opacity="0.5"/>
    <circle cx="1115" cy="144" r="1.0" opacity="0.6"/>
  </g>

  <!-- Fine grid -->
  <g stroke="#0d9488" stroke-width="0.35" opacity="0.04">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="520" y1="0" x2="520" y2="320"/>
    <line x1="780" y1="0" x2="780" y2="320"/>
    <line x1="1040" y1="0" x2="1040" y2="320"/>
  </g>

  <!-- Authentic class-titan + arc-titan icons from svgrepo -->
  <g transform="translate(970,158) scale(4.0) translate(-16, -16)" opacity="0.85" fill="#1fb8a8">
    <!-- Titan class icon (simplified) -->
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
    <path d="M12 6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6 2.69-6 6-6zm0 2c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/>
  </g>

  <g transform="translate(1070,158) scale(3.8) translate(-16, -16)" opacity="0.7" fill="#2dd4bf">
    <!-- Arc titan subclass - lightning bolt style -->
    <path d="M13 3h-2v6h-5v4h5v6h2v-6h5v-4h-5V3zm-4 8h2v4h-2v-4z"/>
  </g>

  <!-- Concentric reticles framing the icons -->
  <g fill="none" stroke="#0d9488">
    <circle cx="1016" cy="158" r="88" stroke-width="0.5" opacity="0.12"/>
    <circle cx="1016" cy="158" r="96" stroke-width="0.3" opacity="0.07"/>
    <circle cx="1016" cy="158" r="104" stroke-width="0.2" opacity="0.04"/>
  </g>

  <!-- Title block -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#textsoft)" opacity="0.55">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#020606" letter-spacing="5.5">[ TITAN · STRIKER · NEW PACIFIC ARCOLOGY ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#020606" letter-spacing="1">SLOANE</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#020606" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#020606" letter-spacing="2.5">SATURN REMEMBERS. THE ARCOLOGY ENDURES. SO DO I.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#0d9488" letter-spacing="5.5">[ TITAN · STRIKER · NEW PACIFIC ARCOLOGY ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#f0fdfa" letter-spacing="1">SLOANE</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#99f6e4" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#a8a8a8" letter-spacing="2.5">SATURN REMEMBERS. <tspan x="210" fill="#2dd4bf">THE ARCOLOGY ENDURES. <tspan x="420" fill="#d97706">SO DO I.</tspan></tspan></text>
  </g>

  <!-- Accent bar under subtitle -->
  <rect x="52" y="160" width="320" height="1" fill="url(#accentbar)"/>

  <!-- Vertical location text on right edge -->
  <text transform="translate(1180, 236) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', sans-serif" font-size="6.5" font-weight="500" letter-spacing="1.2" fill="#0d9488" opacity="0.18">SATURN  ·  NEW PACIFIC ARCOLOGY  ·  THE DEEP</text>

  <!-- Corner brackets -->
  <g fill="none" stroke="#0d9488" stroke-width="1" opacity="0.35">
    <path d="M 20 42 L 20 20 L 42 20"/>
    <path d="M 1180 278 L 1180 300 L 1158 300"/>
  </g>

  <rect width="320" height="320" fill="url(#leftfade)"/>
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>